<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Feed · Pregunta del día</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px; background: #FFFFFF; font-family: 'Source Sans 3', system-ui, sans-serif; color: #14161C; display: flex; flex-direction: column; gap: 44px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 20px">
      <svg viewBox="0 0 120 120" width="72" height="72" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#2F5BD3"/><path d="M84 24L86.8 31.2L94 34L86.8 36.8L84 44L81.2 36.8L74 34L81.2 31.2Z" fill="#FFD27A"/><path d="M23 55C23 51.7 25.7 49 29 49H31V79.5C31 81.2 32.3 82.4 34 82.3C41.8 81.8 49.4 83.2 55.5 87.2V90.8C47.7 87.5 37.8 86.7 27.6 88.2C25 88.6 23 86.5 23 83.9V55Z" fill="#fff"/><path d="M97 55C97 51.7 94.3 49 91 49H89V79.5C89 81.2 87.7 82.4 86 82.3C78.2 81.8 70.6 83.2 64.5 87.2V90.8C72.3 87.5 82.2 86.7 92.4 88.2C95 88.6 97 86.5 97 83.9V55Z" fill="#fff"/><path d="M35 46.5C35 44.6 36.6 43.1 38.5 43.3C45.3 44.1 51.4 46.6 55.5 50.6V82.2C50.5 79.1 44.1 77.7 36.8 78.3C35.8 78.4 35 77.6 35 76.6V46.5Z" fill="#fff"/><path d="M85 46.5C85 44.6 83.4 43.1 81.5 43.3C74.7 44.1 68.6 46.6 64.5 50.6V82.2C69.5 79.1 75.9 77.7 83.2 78.3C84.2 78.4 85 77.6 85 76.6V46.5Z" fill="#fff"/><rect x="56.5" y="25" width="7" height="68" rx="3.5" fill="#fff"/><rect x="44" y="37" width="32" height="7" rx="3.5" fill="#fff"/></svg>
      <span style="font-size: 36px; font-weight: 700">Trivia Católica</span>
    </div>
    <span style="padding: 12px 24px; border-radius: 999px; background: {{soft}}; color: {{color}}; font-size: 26px; font-weight: 700">{{label}}</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 30px; font-weight: 600; color: #5B6170">Pregunta del día</span>
    <h1 style="margin: 0; font-size: 68px; line-height: 1.1; font-weight: 700">¿Quién construyó el arca para salvarse del <span style="color: {{color}}">diluvio</span>?</h1>
    <span style="font-size: 30px; color: #5B6170">Gn 6,14</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 24px; height: 112px; box-sizing: border-box; padding: 0 32px; border-radius: 32px; border: 3px solid #E6E8EE">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F6; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #5B6170">A</span>
      <span style="font-size: 40px; font-weight: 600">Moisés</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; height: 112px; box-sizing: border-box; padding: 0 32px; border-radius: 32px; border: 3px solid #E6E8EE">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F6; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #5B6170">B</span>
      <span style="font-size: 40px; font-weight: 600">Noé</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; height: 112px; box-sizing: border-box; padding: 0 32px; border-radius: 32px; border: 3px solid #E6E8EE">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F6; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #5B6170">C</span>
      <span style="font-size: 40px; font-weight: 600">Abraham</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; height: 112px; box-sizing: border-box; padding: 0 32px; border-radius: 32px; border: 3px solid #E6E8EE">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F6; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #5B6170">D</span>
      <span style="font-size: 40px; font-weight: 600">Elías</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 32px; border-top: 3px solid #E6E8EE">
    <span style="font-size: 30px; font-weight: 600">Dejá tu respuesta en los comentarios</span>
    <span style="font-size: 30px; font-weight: 700; color: #2F5BD3">triviacatolica.com</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"categoria":{"editor":"enum","options":["Antiguo Testamento","Nuevo Testamento","Santos","Sacramentos","Liturgia"],"default":"Antiguo Testamento"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const map = {
      'Antiguo Testamento': ['#A94C25', '#FBEFE6'],
      'Nuevo Testamento': ['#2F5BD3', '#EEF2FD'],
      'Santos': ['#A83E5A', '#FBECEF'],
      'Sacramentos': ['#2B754D', '#E7F4EC'],
      'Liturgia': ['#6A52C2', '#F1EEFB']
    };
    const label = this.props.categoria ?? 'Antiguo Testamento';
    const c = map[label] || map['Antiguo Testamento'];
    return { label, color: c[0], soft: c[1] };
  }
}
</script>
</body>
</html>
