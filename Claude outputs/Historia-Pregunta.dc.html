<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia · Pregunta con sticker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFFFFF; font-family: 'Source Sans 3', system-ui, sans-serif; color: #14161C">

  <div style="position: absolute; left: 96px; right: 96px; top: 260px; bottom: 340px; display: flex; flex-direction: column; gap: 44px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
      <div style="display: flex; align-items: center; gap: 20px">
        <svg viewBox="0 0 120 120" width="72" height="72" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#2F5BD3"/><path d="M84 24L86.8 31.2L94 34L86.8 36.8L84 44L81.2 36.8L74 34L81.2 31.2Z" fill="#FFD27A"/><path d="M23 55C23 51.7 25.7 49 29 49H31V79.5C31 81.2 32.3 82.4 34 82.3C41.8 81.8 49.4 83.2 55.5 87.2V90.8C47.7 87.5 37.8 86.7 27.6 88.2C25 88.6 23 86.5 23 83.9V55Z" fill="#fff"/><path d="M97 55C97 51.7 94.3 49 91 49H89V79.5C89 81.2 87.7 82.4 86 82.3C78.2 81.8 70.6 83.2 64.5 87.2V90.8C72.3 87.5 82.2 86.7 92.4 88.2C95 88.6 97 86.5 97 83.9V55Z" fill="#fff"/><path d="M35 46.5C35 44.6 36.6 43.1 38.5 43.3C45.3 44.1 51.4 46.6 55.5 50.6V82.2C50.5 79.1 44.1 77.7 36.8 78.3C35.8 78.4 35 77.6 35 76.6V46.5Z" fill="#fff"/><path d="M85 46.5C85 44.6 83.4 43.1 81.5 43.3C74.7 44.1 68.6 46.6 64.5 50.6V82.2C69.5 79.1 75.9 77.7 83.2 78.3C84.2 78.4 85 77.6 85 76.6V46.5Z" fill="#fff"/><rect x="56.5" y="25" width="7" height="68" rx="3.5" fill="#fff"/><rect x="44" y="37" width="32" height="7" rx="3.5" fill="#fff"/></svg>
        <span style="font-size: 38px; font-weight: 700">Trivia Católica</span>
      </div>
      <span style="padding: 12px 24px; border-radius: 999px; background: {{soft}}; color: {{color}}; font-size: 26px; font-weight: 700">{{label}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 32px; font-weight: 600; color: #5B6170">Pregunta del día</span>
      <h1 style="margin: 0; font-size: 80px; line-height: 1.08; font-weight: 700; letter-spacing: -0.5px">¿Cuál fue el <span style="color: {{color}}">primer milagro</span> de Jesús?</h1>
      <span style="font-size: 32px; color: #5B6170">Jn 2,1-11</span>
    </div>

    <div style="flex: 1; min-height: 360px; border-radius: 48px; background: {{soft}}; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box">
      <sc-if value="{{guides}}" hint-placeholder-val="{{ true }}">
        <div style="width: 100%; height: 100%; box-sizing: border-box; border: 3px dashed {{color}}; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: {{color}}">
          <span style="font-size: 34px; font-weight: 700">Espacio para el sticker de quiz</span>
          <span style="font-size: 26px; font-weight: 600">Agregalo en Instagram con 3 o 4 opciones</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
      <span style="font-size: 30px; font-weight: 600">La respuesta, en la próxima historia</span>
      <span style="font-size: 32px; font-weight: 700; color: #2F5BD3">triviacatolica.com</span>
    </div>
  </div>

  <sc-if value="{{guides}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 250px; background: rgba(180, 35, 24, 0.12); border-bottom: 3px dashed #B42318; display: flex; align-items: flex-end; padding: 0 24px 12px; box-sizing: border-box; font-size: 24px; font-weight: 700; color: #B42318">Zona segura superior · 250 px</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: rgba(180, 35, 24, 0.12); border-top: 3px dashed #B42318; padding: 12px 24px 0; box-sizing: border-box; font-size: 24px; font-weight: 700; color: #B42318">Zona segura inferior · 340 px</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"guides":{"editor":"boolean","default":true},"categoria":{"editor":"enum","options":["Antiguo Testamento","Nuevo Testamento","Santos","Sacramentos","Liturgia"],"default":"Nuevo Testamento"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    const map = {
      'Antiguo Testamento': ['#A94C25', '#FBEFE6'],
      'Nuevo Testamento': ['#2F5BD3', '#EEF2FD'],
      'Santos': ['#A83E5A', '#FBECEF'],
      'Sacramentos': ['#2B754D', '#E7F4EC'],
      'Liturgia': ['#6A52C2', '#F1EEFB']
    };
    const label = this.props.categoria ?? 'Nuevo Testamento';
    const c = map[label] || map['Nuevo Testamento'];
    return { label, color: c[0], soft: c[1], guides: this.props.guides ?? true };
  }
}
</script>
</body>
</html>
