<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:'Source Sans 3',sans-serif;color:#14161C}
.wrap{position:relative;width:1200px;height:630px;display:flex;align-items:center;padding:0 72px}
.band{position:absolute;right:0;top:0;width:440px;height:630px;background:#EEF2FD;border-left:1.5px solid #E6E8EE}
.txt{position:relative;width:600px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.brand b{font-size:34px;font-weight:700}
h1{font-size:62px;line-height:1.05;font-weight:700;letter-spacing:-.5px;margin-bottom:24px}
h1 span{color:#2F5BD3}
p{font-size:26px;color:#5B6170;line-height:1.3;margin-bottom:34px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;background:#FDF3E1;color:#8A5A0B;font-size:22px;font-weight:600;border:1.5px solid #F3DDB5}
.chip i{width:12px;height:12px;border-radius:50%;background:#E8A33D}
img.m{position:absolute;right:24px;bottom:0;height:570px}
</style></head><body><div class="wrap"><div class="band"></div>
<div class="txt">
<div class="brand">{{mark}}<b>{{brand}}</b></div>
<h1>{{titleA}} <span>{{titleB}}</span></h1>
<p>{{tagline}}</p>
<span class="chip"><i></i>{{chip}}</span>
</div><img class="m" src="../../jesus-app.png"></div></body></html>
